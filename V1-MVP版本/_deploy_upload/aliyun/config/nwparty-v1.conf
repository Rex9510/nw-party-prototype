# ============================================================================
# 党员学时统计系统 V1-MVP · nginx site
# ----------------------------------------------------------------------------
# 监听 8081（H5 静态 + /api 反代到 8000）
# 跟同机其他项目完全隔离：自己一个 site，自己一个端口
# ============================================================================

# ---------- 前端 + API 聚合（8081） ----------
server {
    listen 8081;
    listen [::]:8081;
    server_name __SERVER_NAME__;

    # 安全基线
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 客户端上传大小（与后端 UPLOAD_MAX_SIZE_MB 对齐，建议比后端略大）
    client_max_body_size 12m;

    # 日志（独立 access log，不污染全局）
    access_log /var/log/nwparty/access.log;
    error_log  /var/log/nwparty/error.log;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/x-font-ttf font/opentype
               image/svg+xml image/x-icon;
    gzip_min_length 1024;

    # 静态资源缓存（H5 build 产物，文件名带 hash，可强缓存）
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /var/www/nwparty/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API 反代（/api/* → 127.0.0.1:8000）
    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 长连接 / 流式（如有）
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查（穿透到后端）
    location = /health {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/health;
    }

    # H5 SPA fallback（H5 走 hash 路由，理论上不需要，但兜个底）
    location / {
        root /var/www/nwparty/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
